{% extends "base.html" %}{% block content %}<div class="title-row"><h1>🏷️ Tags</h1><a class="primary" href="?view=tag_new">＋ Neuer Tag</a></div><div class="grid">{% for t in tags %}<article class="card pad"><h2><span class="tag-arrow" style="--tag-color:{{t.color or '#5b7cfa'}}"># {{t.name}}</span></h2><p>{{t.count}} Rezepte</p><div class="actions"><a href="?view=tag_rename&id={{t.id}}">✏️ Umbenennen</a><a class="danger" href="?view=tag_delete&id={{t.id}}">🗑 Löschen</a></div></article>{% else %}<div class="card pad">Noch keine Tags.</div>{% endfor %}</div>{% endblock %}
