{% extends "base.html" %}{% block content %}
<div class="page-head">
  <div>
    <p class="eyebrow">KI-VARIANTE</p>
    <h1>✨ Rezept anpassen</h1>
    <p class="subtle">{{recipe.title}} bleibt als Original erhalten.</p>
  </div>
</div>

{% if error %}<div class="notice error">{{error}}</div>{% endif %}

{% if not preview %}
<section class="panel form-card">
<form method="post" onsubmit="variantWorking(this)">
  <input type="hidden" name="action" value="generate">
  <label>Was soll geändert werden?</label>
  <textarea name="change_request" rows="6" required
    placeholder="z. B. Ich habe keine Sahne. Bitte durch etwas Passendes ersetzen.&#10;Oder: vegetarisch machen&#10;Oder: schneller und einfacher zubereiten">{{change_request}}</textarea>

  <div id="variant-progress" class="ai-working" hidden>
    <span class="spinner"></span>
    <b>KI erstellt eine neue Variante …</b>
  </div>

  <div class="form-actions">
    <a class="secondary" href="?view=recipe&id={{recipe.id}}">Abbrechen</a>
    <button class="primary" id="variant-submit">✨ Variante erstellen</button>
  </div>
</form>
</section>
{% else %}
<section class="panel form-card">
<form method="post">
  <input type="hidden" name="action" value="save">
  <input type="hidden" name="change_request" value="{{change_request}}">

  <label>Name der Variante</label>
  <input name="variant_name" value="{{preview.name}}" required>

  <div class="meta-grid import-meta">
    <div><label>Portionen</label><input name="servings" value="{{preview.servings}}"></div>
    <div><label>Vorbereitung</label><input type="number" min="0" name="prep_minutes" value="{{preview.prep_minutes}}"></div>
    <div><label>Kochen</label><input type="number" min="0" name="cook_minutes" value="{{preview.cook_minutes}}"></div>
    <div><label>Gesamt</label><input type="number" min="0" name="total_minutes" value="{{preview.total_minutes}}"></div>
  </div>

  <label>Zutaten</label>
  <textarea name="ingredients" rows="11">{{preview.ingredients|join('\n')}}</textarea>

  <label>Zubereitung</label>
  <textarea name="steps" rows="12">{{preview.steps|join('\n')}}</textarea>

  <div class="form-actions">
    <a class="secondary" href="?view=recipe&id={{recipe.id}}">Abbrechen</a>
    <button class="primary">Als neue Variante speichern</button>
  </div>
</form>
</section>
{% endif %}

<script>
function variantWorking(form){
  const p=document.getElementById('variant-progress');
  const b=document.getElementById('variant-submit');
  if(p)p.hidden=false;
  if(b){b.disabled=true;b.textContent='Bitte warten …';}
}
</script>
{% endblock %}
